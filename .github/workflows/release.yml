# Builds, signs and publishes a draft GitHub release whenever a v* tag is
# pushed. Follows the HashiCorp provider template so the Terraform Registry can
# ingest the artifacts.
#
# Required repository secrets:
#   TERRAFORM_PROVIDER_PRIVATE_KEY  ASCII-armoured private key whose public half
#                                   is registered on registry.terraform.io for
#                                   the HuberyChen1 namespace
#   PASSPHRASE                      passphrase for that key
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser needs the full history to resolve the previous tag.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go mod download
      - run: make lint
      - run: go test ./... -run 'Test[^A]' -count=1

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.TERRAFORM_PROVIDER_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      # Fail fast, before the multi-minute cross-compile, if the key or the
      # passphrase in the secrets cannot produce a signature.
      - name: Verify signing key
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: |
          echo "fingerprint=$GPG_FINGERPRINT passphrase_length=${#GPG_PASSPHRASE}"
          gpg --list-secret-keys --with-colons | grep -c '^sec' | sed 's/^/secret keys: /'
          printf '%s' "$GPG_PASSPHRASE" | tr -d '\r\n' \
            | gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
                  --local-user "$GPG_FINGERPRINT" --output /tmp/probe.sig --detach-sign go.mod
          gpg --verify /tmp/probe.sig go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.PASSPHRASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
